# Render Blueprint — deploys this app as a single web service.
# In the Render dashboard: New > Blueprint > point at your GitHub repo containing this
# file > Apply. Render reads this file and configures everything automatically.
services:
  - type: web
    name: hospital-costing-tool
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --include=dev --no-audit --no-fund && npm install --prefix client --include=dev --no-audit --no-fund && npm run build --prefix client && node scripts/copy-client-dist.js
    startCommand: npm run start --prefix server
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
